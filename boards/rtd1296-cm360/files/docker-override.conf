# 由移植工程添加（2026-10-05）—— 修 fnOS 自带的 ExecStop 缺陷
#
# 问题 1（原缺陷）：fnOS 的 docker.service 里
#     ExecStop=/bin/sh -c "docker stop --time 3 $(docker ps -a -q)"
#   一个容器都没有时展开成 `docker stop --time 3`，
#   docker 报 "requires at least 1 argument" 并以 1 退出
#   → systemd 把整个 docker.service 判为 failed。
# 问题 2（我们实测补充）：即使有容器，`docker stop` 在 dockerd 正在关闭时
#   会一直等下去，使单元长期停在 deactivating（实测卡住不动）。
#   所以外面再套一层 timeout。
#
# 背景：fnOS 的 dockermgr 会在 docker 启动约 7 秒后停/重启它，
#   于是这两个问题在**每次开机**必然触发。
#
# 用 drop-in 而不是改原文件：fnOS 升级覆盖原单元时这份仍生效。
[Service]
ExecStop=
ExecStop=/bin/sh -c "timeout 15 docker stop --time 3 $(docker ps -aq 2>/dev/null) 2>/dev/null || true"
TimeoutStopSec=30
